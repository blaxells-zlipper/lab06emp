{% load static %}
<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>{% block title %}WebShop{% endblock %}</title>
    <link href="{% static 'vendor/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'css/shop.css' %}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'tienda:index' %}">Tienda Lab06</a>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <aside class="col-lg-3 mb-4">
                <h5 class="mb-3">Categorias</h5>
                <div class="list-group shadow-sm">
                    {% for cat in categorias %}
                        <a class="list-group-item list-group-item-action d-flex align-items-center"
                           href="{% url 'tienda:productos_por_categoria' cat.id %}">
                            {% if cat.foto %}
                                <img class="category-thumb mr-2" src="{{ cat.foto.url }}" alt="{{ cat.nombre }}">
                            {% endif %}
                            <span>{{ cat.nombre }}</span>
                        </a>
                    {% empty %}
                        <div class="list-group-item">No hay categorias</div>
                    {% endfor %}
                </div>
            </aside>

            <main class="col-lg-9">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    <script src="{% static 'vendor/jquery/jquery.min.js' %}"></script>
    <script src="{% static 'vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
